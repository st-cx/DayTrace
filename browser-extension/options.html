<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>DayTrace 扩展设置</title><style>body{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;max-width:560px;margin:48px auto;color:#233a4b;line-height:1.8}input[type=password],select{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px;border-radius:8px;border:1px solid #ced7df}button{padding:10px 20px;background:#137d78;color:white;border:0;border-radius:8px}#status{margin-top:16px}label{display:block}</style></head><body><h1>DayTrace · 网站域名记录</h1><p>只向本机发送当前域名，不发送网址路径、正文或标签页历史。隐身窗口始终不记录。切换到新标签页、本地页面或失去焦点时会清空网站记录。</p><label>扩展连接密钥（在 DayTrace 的隐私与数据页复制）<input type="password" id="token" autocomplete="off" placeholder="粘贴连接密钥"></label><label>当前浏览器<select id="browser"><option value="chrome.exe">Chrome</option><option value="msedge.exe">Edge</option><option value="brave.exe">Brave</option><option value="opera.exe">Opera</option></select></label><label><input type="checkbox" id="enabled"> 启用当前浏览器域名记录</label><p>DayTrace 中也需开启域名采集。连接密钥在重启后保持有效，只授予域名上报权限。不要分享密钥。</p><button id="save">保存设置</button><p id="status" role="status"></p><script src="options.js"></script></body></html>
